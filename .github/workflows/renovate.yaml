name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: 0 4 * * *

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
          RENOVATE_DOCKER_MAX_PAGES: "10" # DockerHub rejects anonymous tag paging past page 10 (1000 tags, error 403), which drops all release timestamps, causing renovate to ignore affected dependencies when minimumReleaseAge is set
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
