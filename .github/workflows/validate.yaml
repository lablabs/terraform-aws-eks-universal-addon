name: Terraform validate

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master

jobs:
  extract-version:
    name: Extract min/max Terraform versions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract Terraform min/max versions
        id: terraform-min-max
        uses: clowdhaus/terraform-min-max@5e40f8cf535d84fbd031571abd363ffd81dbfbfc # v3.0.1
        with:
          directory: .
    outputs:
      minVersion: ${{ steps.terraform-min-max.outputs.minVersion }}
      maxVersion: ${{ steps.terraform-min-max.outputs.maxVersion }}

  terraform-validate:
    runs-on: ubuntu-24.04
    needs: extract-version
    strategy:
      matrix:
        tf_ver:
          - ${{ needs.extract-version.outputs.minVersion }}
          - ${{ needs.extract-version.outputs.maxVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.tf_ver }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test -verbose
